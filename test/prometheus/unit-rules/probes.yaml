# Generated by TestPrometheusRuleFiles (internal/observability/rules_test.go) from the PrometheusRule of the "probes" spec in ruleFileCases, without descriptions.
# Do not edit: run `make test-rules`.
groups:
- name: forgejo.ns.fj
  rules:
  - alert: ForgejoDown
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoDown.md
      summary: Forgejo ns/fj is down
    expr: (max(up{namespace="ns", job="fj-http"}) == 0 or absent(up{namespace="ns",
      job="fj-http"})) unless on() forgejo_operator_instance_info{namespace="ns",
      name="fj", phase=~"Restoring|Paused"}
    for: 5m
    labels:
      forgejo: fj
      namespace: ns
      severity: critical
  - alert: ForgejoOperatorMetricsMissing
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoOperatorMetricsMissing.md
      summary: Operator metrics of Forgejo ns/fj are missing
    expr: absent(forgejo_operator_instance_ready{namespace="ns", name="fj"})
    for: 15m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoBroken
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoBroken.md
      summary: Forgejo ns/fj is Broken and the operator has stopped changing it
    expr: max(forgejo_operator_instance_info{namespace="ns", name="fj", phase="Broken"})
      > 0
    for: 2m
    labels:
      forgejo: fj
      namespace: ns
      severity: critical
  - alert: ForgejoNotReady
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoNotReady.md
      summary: Forgejo ns/fj has not been Ready for 10 minutes
    expr: max(forgejo_operator_instance_ready{namespace="ns", name="fj"}) == 0 unless
      on() forgejo_operator_instance_info{namespace="ns", name="fj", phase=~"Restoring|Paused"}
    for: 10m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoHealthCheckFailing
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoHealthCheckFailing.md
      summary: Forgejo ns/fj fails its health checks
    expr: increase(forgejo_operator_health_check_failures_total{namespace="ns", name="fj"}[10m])
      > 3
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoHealthProbeUnreachable
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoHealthProbeUnreachable.md
      summary: The operator cannot reach Forgejo ns/fj
    expr: increase(forgejo_operator_health_check_unreachable_total{namespace="ns",
      name="fj"}[20m]) > 0
    for: 15m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoBackupFailed
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoBackupFailed.md
      summary: A backup of Forgejo ns/fj failed
    expr: sum by (namespace, name) (increase(forgejo_operator_backups_total{namespace="ns",
      name="fj", result="failed"}[1h]) > 0 or (forgejo_operator_backups_total{namespace="ns",
      name="fj", result="failed"} unless forgejo_operator_backups_total{namespace="ns",
      name="fj", result="failed"} offset 1h)) > 0
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoVolumeAlmostFull
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoVolumeAlmostFull.md
      summary: Volume {{ $labels.claim }} of Forgejo ns/fj is almost full
    expr: max by (namespace, name, claim) (forgejo_operator_volume_used_ratio{namespace="ns",
      name="fj"}) > 0.9
    for: 10m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoUpgradeFailed
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoUpgradeFailed.md
      summary: An upgrade of Forgejo ns/fj failed
    expr: sum by (namespace, name) (increase(forgejo_operator_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"}[1h]) > 0 or (forgejo_operator_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"} unless forgejo_operator_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"} offset 1h)) > 0
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoDatabaseUpgradeFailed
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoDatabaseUpgradeFailed.md
      summary: A PostgreSQL major upgrade of Forgejo ns/fj failed
    expr: sum by (namespace, name) (increase(forgejo_operator_database_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"}[1h]) > 0 or (forgejo_operator_database_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"} unless forgejo_operator_database_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"} offset 1h)) > 0
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoVersionUnsupported
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoVersionUnsupported.md
      summary: Forgejo ns/fj runs a version outside the operator's support policy
        ({{ $labels.support }})
    expr: max by (namespace, name, major, support) (forgejo_operator_version_supported{namespace="ns",
      name="fj"}) == 0
    for: 1h
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoVersionAdvisory
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoVersionAdvisory.md
      summary: Forgejo ns/fj runs a patch release that an advisory recommends replacing
    expr: max by (namespace, name, major) (forgejo_operator_version_advisory{namespace="ns",
      name="fj"}) == 1
    for: 1h
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoRunnersOffline
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoRunnersOffline.md
      summary: Jobs wait for ForgejoRunner {{ $labels.runner }} of Forgejo ns/fj,
        but none of its runners is online
    expr: max by (namespace, name, runner) (forgejo_operator_runner_jobs_waiting{namespace="ns",
      name="fj"}) > 0 and on (namespace, name, runner) max by (namespace, name, runner)
      (forgejo_operator_runners_online{namespace="ns", name="fj"}) == 0 and on (namespace,
      name, runner) max by (namespace, name, runner) (forgejo_operator_runners_desired{namespace="ns",
      name="fj"}) > 0
    for: 10m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoAutoPilotActive
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAutoPilotActive.md
      summary: The operator keeps intervening on Forgejo ns/fj
    expr: sum by (namespace, name) (increase(forgejo_operator_autopilot_actions_total{namespace="ns",
      name="fj"}[1h])) >= 5
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
- name: forgejo-slo.ns.fj
  rules:
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[30m])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[30m])),
      1 / 600)
    labels:
      name: fj
      namespace: ns
      window: 30m
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[1h])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[1h])),
      1 / 600)
    labels:
      name: fj
      namespace: ns
      window: 1h
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[2h])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[2h])),
      1 / 600)
    labels:
      name: fj
      namespace: ns
      window: 2h
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[6h])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[6h])),
      1 / 600)
    labels:
      name: fj
      namespace: ns
      window: 6h
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[1d])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[1d])),
      1 / 600)
    labels:
      name: fj
      namespace: ns
      window: 1d
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[3d])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[3d])),
      1 / 600)
    labels:
      name: fj
      namespace: ns
      window: 3d
    record: forgejo_slo:availability_error_ratio
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="30m"}
      / 0.005
    labels:
      name: fj
      namespace: ns
      window: 30m
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="1h"}
      / 0.005
    labels:
      name: fj
      namespace: ns
      window: 1h
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="2h"}
      / 0.005
    labels:
      name: fj
      namespace: ns
      window: 2h
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="6h"}
      / 0.005
    labels:
      name: fj
      namespace: ns
      window: 6h
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="1d"}
      / 0.005
    labels:
      name: fj
      namespace: ns
      window: 1d
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="3d"}
      / 0.005
    labels:
      name: fj
      namespace: ns
      window: 3d
    record: forgejo_slo:availability_burn_rate
  - alert: ForgejoAvailabilityFastBurn
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAvailabilityFastBurn.md
      summary: Forgejo ns/fj burns its availability error budget at 14.4x over 1h
        (fast burn)
    expr: max by (namespace, name) (forgejo_slo:availability_burn_rate{namespace="ns",
      name="fj", window="1h"}) > 14.4 and on (namespace, name) max by (namespace,
      name) (forgejo_slo:availability_burn_rate{namespace="ns", name="fj", window="30m"})
      > 14.4
    labels:
      forgejo: fj
      long: 1h
      namespace: ns
      severity: critical
      short: 30m
      slo: availability
  - alert: ForgejoAvailabilityFastBurn
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAvailabilityFastBurn.md
      summary: Forgejo ns/fj burns its availability error budget at 6x over 6h (fast
        burn)
    expr: max by (namespace, name) (forgejo_slo:availability_burn_rate{namespace="ns",
      name="fj", window="6h"}) > 6 and on (namespace, name) max by (namespace, name)
      (forgejo_slo:availability_burn_rate{namespace="ns", name="fj", window="30m"})
      > 6
    labels:
      forgejo: fj
      long: 6h
      namespace: ns
      severity: critical
      short: 30m
      slo: availability
  - alert: ForgejoAvailabilitySlowBurn
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAvailabilitySlowBurn.md
      summary: Forgejo ns/fj burns its availability error budget at 3x over 1d (slow
        burn)
    expr: max by (namespace, name) (forgejo_slo:availability_burn_rate{namespace="ns",
      name="fj", window="1d"}) > 3 and on (namespace, name) max by (namespace, name)
      (forgejo_slo:availability_burn_rate{namespace="ns", name="fj", window="2h"})
      > 3
    labels:
      forgejo: fj
      long: 1d
      namespace: ns
      severity: warning
      short: 2h
      slo: availability
  - alert: ForgejoAvailabilitySlowBurn
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAvailabilitySlowBurn.md
      summary: Forgejo ns/fj burns its availability error budget at 1x over 3d (slow
        burn)
    expr: max by (namespace, name) (forgejo_slo:availability_burn_rate{namespace="ns",
      name="fj", window="3d"}) > 1 and on (namespace, name) max by (namespace, name)
      (forgejo_slo:availability_burn_rate{namespace="ns", name="fj", window="6h"})
      > 1
    labels:
      forgejo: fj
      long: 3d
      namespace: ns
      severity: warning
      short: 6h
      slo: availability
- interval: 3m
  name: forgejo-slo-window.ns.fj
  rules:
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[30d])) / sum by (namespace, name)
      (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[30d]))
    labels:
      name: fj
      namespace: ns
      window: 30d
    record: forgejo_slo:availability_error_ratio
  - expr: vector(0.995)
    labels:
      name: fj
      namespace: ns
      window: 30d
    record: forgejo_slo:availability_objective
  - expr: 1 - forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="30d"}
      / 0.005
    labels:
      name: fj
      namespace: ns
      window: 30d
    record: forgejo_slo:availability_error_budget_remaining
