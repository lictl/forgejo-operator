# Generated by TestPrometheusRuleFiles (internal/observability/rules_test.go) from config/prometheus/rules.yaml, without descriptions.
# Do not edit: run `make test-rules`.
groups:
- name: forgejo-operator
  rules:
  - alert: ForgejoOperatorDown
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoOperatorDown.md
      summary: The Forgejo operator is not running or not scraped
    expr: absent(controller_runtime_reconcile_total{controller="forgejo"})
    for: 10m
    labels:
      severity: critical
  - alert: ForgejoOperatorReconcileErrors
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoOperatorReconcileErrors.md
      summary: The Forgejo operator keeps failing to reconcile {{ $labels.controller
        }}
    expr: sum by (controller) (increase(controller_runtime_reconcile_errors_total{controller=~"forgejo|forgejobackup|forgejorestore|forgejorunner"}[15m]))
      > 5
    for: 15m
    labels:
      severity: warning
  - alert: ForgejoOperatorWorkQueueBacklog
    annotations:
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoOperatorWorkQueueBacklog.md
      summary: The Forgejo operator work queue {{ $labels.name }} is backing up
    expr: max by (name) (workqueue_depth{name=~"forgejo|forgejobackup|forgejorestore|forgejorunner"})
      > 20
    for: 15m
    labels:
      severity: warning
