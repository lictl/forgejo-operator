# Generated by TestPrometheusRuleFiles (internal/observability/rules_test.go) from the PrometheusRule of the "backups" spec in ruleFileCases.
# Do not edit: run `make test-rules`.
groups:
- name: forgejo.ns.fj
  rules:
  - alert: ForgejoDown
    annotations:
      description: Prometheus cannot scrape any Forgejo pod behind Service fj-http
        for 5 minutes. Check `kubectl get pods -n ns -l app.kubernetes.io/instance=fj`,
        the pod logs and the Ready/Healthy conditions of `kubectl describe fj fj -n
        ns`.
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoDown.md
      summary: Forgejo ns/fj is down
    expr: (max(up{namespace="ns", job="fj-http"}) == 0 or absent(up{namespace="ns",
      job="fj-http"})) unless on() forgejo_operator_instance_info{namespace="ns",
      name="fj", phase=~"Restoring|Paused"}
    for: 5m
    labels:
      forgejo: fj
      namespace: ns
      severity: critical
  - alert: ForgejoOperatorMetricsMissing
    annotations:
      description: 'Prometheus has no forgejo_operator_instance_ready series for this
        instance, so every other alert of ns/fj except ForgejoDown is inactive (backup,
        health, volume, upgrade and autopilot alerts). Either the operator is not
        running, or it is not scraped: enable config/prometheus in config/default/kustomization.yaml
        (its ServiceMonitor sets honorLabels: true, which these alerts need) and allow
        Prometheus''s ServiceAccount to GET the /metrics non-resource URL (the operator''s
        metrics-reader ClusterRole). See docs/observability.md, "Scraping the operator".'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoOperatorMetricsMissing.md
      summary: Operator metrics of Forgejo ns/fj are missing
    expr: absent(forgejo_operator_instance_ready{namespace="ns", name="fj"})
    for: 15m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoBroken
    annotations:
      description: 'The operator found the instance in a state it does not repair:
        an identity Secret, the data volume or the CNPG cluster of an instance that
        has run is missing or belongs to another instance, a PostgreSQL major upgrade
        failed after it may have changed the data, or a recreated database waits for
        its restore. Running pods are left alone, and backups, retention, upgrades
        and autopilot wait. The Broken condition of `kubectl describe fj fj -n ns`
        says what is missing and how to restore it.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoBroken.md
      summary: Forgejo ns/fj is Broken and the operator has stopped changing it
    expr: max(forgejo_operator_instance_info{namespace="ns", name="fj", phase="Broken"})
      > 0
    for: 2m
    labels:
      forgejo: fj
      namespace: ns
      severity: critical
  - alert: ForgejoNotReady
    annotations:
      description: The operator reports the instance as not Ready. Run `kubectl describe
        fj fj -n ns` and look at status.conditions (DatabaseReady, Progressing, Degraded)
        and recent events.
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoNotReady.md
      summary: Forgejo ns/fj has not been Ready for 10 minutes
    expr: max(forgejo_operator_instance_ready{namespace="ns", name="fj"}) == 0 unless
      on() forgejo_operator_instance_info{namespace="ns", name="fj", phase=~"Restoring|Paused"}
    for: 10m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoHealthCheckFailing
    annotations:
      description: More than 3 operator probes of /api/healthz failed in the last
        10 minutes ({{ $value | printf "%.0f" }}). `kubectl get fj fj -n ns -o jsonpath='{.status.health}'`
        shows the failing checks (database:ping, cache:ping). With self-healing enabled
        the operator restarts pods after spec.autoPilot.selfHealing.failureThreshold
        consecutive failures.
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoHealthCheckFailing.md
      summary: Forgejo ns/fj fails its health checks
    expr: increase(forgejo_operator_health_check_failures_total{namespace="ns", name="fj"}[10m])
      > 3
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoHealthProbeUnreachable
    annotations:
      description: 'For 15 minutes the operator''s probes of /api/healthz have not
        reached Forgejo (DNS, dial or connection errors, or a proxy answering instead).
        Health checks, self-healing, status.version and status.stats are blind until
        it can: a NetworkPolicy or service mesh must allow the operator''s pods to
        connect to Service fj-http port 3000 in namespace ns (Istio STRICT mTLS: PERMISSIVE
        for that port, or a sidecar for the operator). The Healthy condition of `kubectl
        describe fj fj -n ns` (reason Unreachable) names the error.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoHealthProbeUnreachable.md
      summary: The operator cannot reach Forgejo ns/fj
    expr: increase(forgejo_operator_health_check_unreachable_total{namespace="ns",
      name="fj"}[5m]) > 0
    for: 15m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoBackupFailed
    annotations:
      description: At least one ForgejoBackup failed in the last hour. Run `kubectl
        get forgejobackups -n ns -l forgejo.lucas.icu/instance=fj` and inspect the
        failed backup's status and Job logs (database reachability, space on the fj-backups
        PVC).
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoBackupFailed.md
      summary: A backup of Forgejo ns/fj failed
    expr: sum by (namespace, name) (increase(forgejo_operator_backups_total{namespace="ns",
      name="fj", result="failed"}[1h]) > 0 or (forgejo_operator_backups_total{namespace="ns",
      name="fj", result="failed"} unless forgejo_operator_backups_total{namespace="ns",
      name="fj", result="failed"} offset 1h)) > 0
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoBackupTooOld
    annotations:
      description: Scheduled backups ("0 3 * * *") must keep the last successful backup
        younger than the recovery point objective of 2d (two schedule intervals).
        Check status.backup and the BackupHealthy condition of `kubectl describe fj
        fj -n ns`, and the most recent ForgejoBackups (`kubectl get fjb -n ns -l forgejo.lucas.icu/instance=fj`).
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoBackupTooOld.md
      summary: The last successful backup of Forgejo ns/fj is older than its RPO of
        2d
    expr: time() - max(forgejo_operator_backup_last_success_timestamp_seconds{namespace="ns",
      name="fj"}) > 172800
    for: 5m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoBackupMissing
    annotations:
      description: Scheduled backups ("0 3 * * *") must keep the last successful backup
        younger than the recovery point objective of 2d (two schedule intervals).
        Check status.backup and the BackupHealthy condition of `kubectl describe fj
        fj -n ns`, and the most recent ForgejoBackups (`kubectl get fjb -n ns -l forgejo.lucas.icu/instance=fj`).
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoBackupMissing.md
      summary: Forgejo ns/fj has no successful backup
    expr: absent(forgejo_operator_backup_last_success_timestamp_seconds{namespace="ns",
      name="fj"}) and on() count(forgejo_operator_instance_ready{namespace="ns", name="fj"})
      > 0
    for: 2d
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoVolumeAlmostFull
    annotations:
      description: 'PVC {{ $labels.claim }} is {{ $value | humanizePercentage }} full.
        If spec.autoPilot.storageAutoExpand is enabled, check status.storage and events
        for failed expansions (the StorageClass needs allowVolumeExpansion, and maxSize
        may have been reached); otherwise increase the PVC size: `kubectl get pvc
        -n ns`.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoVolumeAlmostFull.md
      summary: Volume {{ $labels.claim }} of Forgejo ns/fj is almost full
    expr: max by (namespace, name, claim) (forgejo_operator_volume_used_ratio{namespace="ns",
      name="fj"}) > 0.9
    for: 10m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoUpgradeFailed
    annotations:
      description: An image upgrade failed or was rolled back in the last hour. status.upgrade
        of `kubectl get fj fj -n ns -o yaml` names the failed image; it is not retried
        until spec.image changes. Check the logs of the failed pods for migration
        errors.
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoUpgradeFailed.md
      summary: An upgrade of Forgejo ns/fj failed
    expr: sum by (namespace, name) (increase(forgejo_operator_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"}[1h]) > 0 or (forgejo_operator_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"} unless forgejo_operator_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"} offset 1h)) > 0
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoDatabaseUpgradeFailed
    annotations:
      description: A PostgreSQL major upgrade of the CNPG cluster failed or was rolled
        back in the last hour. status.database.upgrade of `kubectl get fj fj -n ns
        -o yaml` names the failed image and the reason; it is not retried until spec.database.cnpg.imageName
        changes. With rollbackRestoreFailed Forgejo stays stopped until a backup is
        restored. See docs/upgrades.md, "PostgreSQL major upgrades".
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoDatabaseUpgradeFailed.md
      summary: A PostgreSQL major upgrade of Forgejo ns/fj failed
    expr: sum by (namespace, name) (increase(forgejo_operator_database_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"}[1h]) > 0 or (forgejo_operator_database_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"} unless forgejo_operator_database_upgrades_total{namespace="ns",
      name="fj", result!="succeeded"} offset 1h)) > 0
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoVersionUnsupported
    annotations:
      description: 'Forgejo major {{ $labels.major }} is {{ $labels.support }}: the
        operator supports the current LTS release and the latest release (Deprecated:
        still maintained upstream but outside that policy; EndOfLife: no more security
        fixes; Future: newer than the operator''s version table; Unknown: the version
        cannot be determined). The VersionSupported condition of `kubectl describe
        fj fj -n ns` says what to upgrade to and by when; see docs/versions.md.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoVersionUnsupported.md
      summary: Forgejo ns/fj runs a version outside the operator's support policy
        ({{ $labels.support }})
    expr: max by (namespace, name, major, support) (forgejo_operator_version_supported{namespace="ns",
      name="fj"}) == 0
    for: 1h
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoVersionAdvisory
    annotations:
      description: 'The running Forgejo {{ $labels.major }} patch release is older
        than the one the operator''s version table recommends (critical security fixes,
        or a release upstream advises against). The VersionSupported condition of
        `kubectl describe fj fj -n ns` names the minimum patch release and why; pin
        spec.image to it (N.0.P), or pull the floating tag again (imagePullPolicy:
        Always). See docs/versions.md.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoVersionAdvisory.md
      summary: Forgejo ns/fj runs a patch release that an advisory recommends replacing
    expr: max by (namespace, name, major) (forgejo_operator_version_advisory{namespace="ns",
      name="fj"}) == 1
    for: 1h
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoRunnersOffline
    annotations:
      description: '{{ $value | printf "%.0f" }} jobs have waited for at least 10
        minutes for runners with the labels of ForgejoRunner {{ $labels.runner }},
        and Forgejo reports none of its runners online. `kubectl -n ns describe forgejorunner
        {{ $labels.runner }}` shows why (Ready and Registered conditions); check the
        runner pods'' logs (`kubectl -n ns logs {{ $labels.runner }}-0 -c runner`)
        for connection or authentication errors.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoRunnersOffline.md
      summary: Jobs wait for ForgejoRunner {{ $labels.runner }} of Forgejo ns/fj,
        but none of its runners is online
    expr: max by (namespace, name, runner) (forgejo_operator_runner_jobs_waiting{namespace="ns",
      name="fj"}) > 0 and on (namespace, name, runner) max by (namespace, name, runner)
      (forgejo_operator_runners_online{namespace="ns", name="fj"}) == 0 and on (namespace,
      name, runner) max by (namespace, name, runner) (forgejo_operator_runners_desired{namespace="ns",
      name="fj"}) > 0
    for: 10m
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
  - alert: ForgejoAutoPilotActive
    annotations:
      description: About {{ $value | printf "%.0f" }} autonomous actions (restarts,
        rollbacks, scaling, expansion) were taken in the last hour, which usually
        hides a persistent problem. See status.autoPilot.recentActions of `kubectl
        get fj fj -n ns -o yaml` and the events.
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAutoPilotActive.md
      summary: The operator keeps intervening on Forgejo ns/fj
    expr: sum by (namespace, name) (increase(forgejo_operator_autopilot_actions_total{namespace="ns",
      name="fj"}[1h])) >= 5
    labels:
      forgejo: fj
      namespace: ns
      severity: warning
- name: forgejo-slo.ns.fj
  rules:
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[5m])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[5m])),
      1 / 30)
    labels:
      name: fj
      namespace: ns
      window: 5m
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[28m])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[28m])),
      1 / 30)
    labels:
      name: fj
      namespace: ns
      window: 28m
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[56m])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[56m])),
      1 / 30)
    labels:
      name: fj
      namespace: ns
      window: 56m
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[1h52m])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[1h52m])),
      1 / 30)
    labels:
      name: fj
      namespace: ns
      window: 1h52m
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[5h36m])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[5h36m])),
      1 / 30)
    labels:
      name: fj
      namespace: ns
      window: 5h36m
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[22h24m])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[22h24m])),
      1 / 30)
    labels:
      name: fj
      namespace: ns
      window: 22h24m
    record: forgejo_slo:availability_error_ratio
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[2d19h12m])) / clamp_min(sum by (namespace,
      name) (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[2d19h12m])),
      1 / 30)
    labels:
      name: fj
      namespace: ns
      window: 2d19h12m
    record: forgejo_slo:availability_error_ratio
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="5m"}
      / 0.001
    labels:
      name: fj
      namespace: ns
      window: 5m
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="28m"}
      / 0.001
    labels:
      name: fj
      namespace: ns
      window: 28m
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="56m"}
      / 0.001
    labels:
      name: fj
      namespace: ns
      window: 56m
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="1h52m"}
      / 0.001
    labels:
      name: fj
      namespace: ns
      window: 1h52m
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="5h36m"}
      / 0.001
    labels:
      name: fj
      namespace: ns
      window: 5h36m
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="22h24m"}
      / 0.001
    labels:
      name: fj
      namespace: ns
      window: 22h24m
    record: forgejo_slo:availability_burn_rate
  - expr: forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="2d19h12m"}
      / 0.001
    labels:
      name: fj
      namespace: ns
      window: 2d19h12m
    record: forgejo_slo:availability_burn_rate
  - alert: ForgejoAvailabilityFastBurn
    annotations:
      description: 'Over the last 56m, and still over the last 5m, the operator''s
        probes found Forgejo unavailable {{ $value | printf "%.1f" }} times as often
        as the objective allows (99.9% over 28d, error budget 0.001). At 14.4x the
        whole budget is gone within 1d22h40m. Planned samples (restores, orchestrated
        upgrades, spec.paused, zero replicas, the first installation) count as available.
        Page: act now. Start with `kubectl describe fj fj -n ns` (Ready, Healthy,
        DatabaseReady), `kubectl get pods -n ns -l app.kubernetes.io/instance=fj`
        and the ForgejoDown, ForgejoNotReady, ForgejoHealthCheckFailing and ForgejoHealthProbeUnreachable
        alerts.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAvailabilityFastBurn.md
      summary: Forgejo ns/fj burns its availability error budget at 14.4x over 56m
        (fast burn)
    expr: max by (namespace, name) (forgejo_slo:availability_burn_rate{namespace="ns",
      name="fj", window="56m"}) > 14.4 and on (namespace, name) max by (namespace,
      name) (forgejo_slo:availability_burn_rate{namespace="ns", name="fj", window="5m"})
      > 14.4
    labels:
      forgejo: fj
      long: 56m
      namespace: ns
      severity: critical
      short: 5m
      slo: availability
  - alert: ForgejoAvailabilityFastBurn
    annotations:
      description: 'Over the last 5h36m, and still over the last 28m, the operator''s
        probes found Forgejo unavailable {{ $value | printf "%.1f" }} times as often
        as the objective allows (99.9% over 28d, error budget 0.001). At 6x the whole
        budget is gone within 4d16h. Planned samples (restores, orchestrated upgrades,
        spec.paused, zero replicas, the first installation) count as available. Page:
        act now. Start with `kubectl describe fj fj -n ns` (Ready, Healthy, DatabaseReady),
        `kubectl get pods -n ns -l app.kubernetes.io/instance=fj` and the ForgejoDown,
        ForgejoNotReady, ForgejoHealthCheckFailing and ForgejoHealthProbeUnreachable
        alerts.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAvailabilityFastBurn.md
      summary: Forgejo ns/fj burns its availability error budget at 6x over 5h36m
        (fast burn)
    expr: max by (namespace, name) (forgejo_slo:availability_burn_rate{namespace="ns",
      name="fj", window="5h36m"}) > 6 and on (namespace, name) max by (namespace,
      name) (forgejo_slo:availability_burn_rate{namespace="ns", name="fj", window="28m"})
      > 6
    labels:
      forgejo: fj
      long: 5h36m
      namespace: ns
      severity: critical
      short: 28m
      slo: availability
  - alert: ForgejoAvailabilitySlowBurn
    annotations:
      description: 'Over the last 22h24m, and still over the last 1h52m, the operator''s
        probes found Forgejo unavailable {{ $value | printf "%.1f" }} times as often
        as the objective allows (99.9% over 28d, error budget 0.001). At 3x the whole
        budget is gone within 9d8h. Planned samples (restores, orchestrated upgrades,
        spec.paused, zero replicas, the first installation) count as available. Ticket:
        fix it within working hours. Start with `kubectl describe fj fj -n ns` (Ready,
        Healthy, DatabaseReady), `kubectl get pods -n ns -l app.kubernetes.io/instance=fj`
        and the ForgejoDown, ForgejoNotReady, ForgejoHealthCheckFailing and ForgejoHealthProbeUnreachable
        alerts.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAvailabilitySlowBurn.md
      summary: Forgejo ns/fj burns its availability error budget at 3x over 22h24m
        (slow burn)
    expr: max by (namespace, name) (forgejo_slo:availability_burn_rate{namespace="ns",
      name="fj", window="22h24m"}) > 3 and on (namespace, name) max by (namespace,
      name) (forgejo_slo:availability_burn_rate{namespace="ns", name="fj", window="1h52m"})
      > 3
    labels:
      forgejo: fj
      long: 22h24m
      namespace: ns
      severity: warning
      short: 1h52m
      slo: availability
  - alert: ForgejoAvailabilitySlowBurn
    annotations:
      description: 'Over the last 2d19h12m, and still over the last 5h36m, the operator''s
        probes found Forgejo unavailable {{ $value | printf "%.1f" }} times as often
        as the objective allows (99.9% over 28d, error budget 0.001). At 1x the whole
        budget is gone within 4w. Planned samples (restores, orchestrated upgrades,
        spec.paused, zero replicas, the first installation) count as available. Ticket:
        fix it within working hours. Start with `kubectl describe fj fj -n ns` (Ready,
        Healthy, DatabaseReady), `kubectl get pods -n ns -l app.kubernetes.io/instance=fj`
        and the ForgejoDown, ForgejoNotReady, ForgejoHealthCheckFailing and ForgejoHealthProbeUnreachable
        alerts.'
      runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoAvailabilitySlowBurn.md
      summary: Forgejo ns/fj burns its availability error budget at 1x over 2d19h12m
        (slow burn)
    expr: max by (namespace, name) (forgejo_slo:availability_burn_rate{namespace="ns",
      name="fj", window="2d19h12m"}) > 1 and on (namespace, name) max by (namespace,
      name) (forgejo_slo:availability_burn_rate{namespace="ns", name="fj", window="5h36m"})
      > 1
    labels:
      forgejo: fj
      long: 2d19h12m
      namespace: ns
      severity: warning
      short: 5h36m
      slo: availability
  - expr: time() - max by (namespace, name) (forgejo_operator_backup_last_success_timestamp_seconds{namespace="ns",
      name="fj"})
    labels:
      copy: local
      name: fj
      namespace: ns
    record: forgejo_slo:backup_recovery_point_age_seconds
  - expr: vector(172800)
    labels:
      name: fj
      namespace: ns
    record: forgejo_slo:backup_recovery_point_objective_seconds
- interval: 3m
  name: forgejo-slo-window.ns.fj
  rules:
  - expr: sum by (namespace, name) (rate(forgejo_operator_availability_probes_total{namespace="ns",
      name="fj", planned="false", result="down"}[28d])) / sum by (namespace, name)
      (rate(forgejo_operator_availability_probes_total{namespace="ns", name="fj"}[28d]))
    labels:
      name: fj
      namespace: ns
      window: 28d
    record: forgejo_slo:availability_error_ratio
  - expr: vector(0.999)
    labels:
      name: fj
      namespace: ns
      window: 28d
    record: forgejo_slo:availability_objective
  - expr: 1 - forgejo_slo:availability_error_ratio{namespace="ns", name="fj", window="28d"}
      / 0.001
    labels:
      name: fj
      namespace: ns
      window: 28d
    record: forgejo_slo:availability_error_budget_remaining
