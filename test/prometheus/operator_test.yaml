# promtool unit tests of the operator's own alerts (config/prometheus/rules.yaml). Run with
# `make test-rules`.
rule_files:
  - unit-rules/operator.yaml
evaluation_interval: 1m

tests:
  - name: a running operator raises nothing
    interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_total{controller="forgejo", result="success"}'
        values: '0+10x40'
      - series: 'controller_runtime_reconcile_errors_total{controller="forgejo"}'
        values: '0+0.1x40'
      - series: 'workqueue_depth{name="forgejo"}'
        values: '2x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: ForgejoOperatorDown, exp_alerts: []}
      - {eval_time: 30m, alertname: ForgejoOperatorReconcileErrors, exp_alerts: []}
      - {eval_time: 30m, alertname: ForgejoOperatorWorkQueueBacklog, exp_alerts: []}

  - name: the operator is not scraped
    interval: 1m
    input_series:
      - series: 'up{job="something-else"}'
        values: '1x20'
    alert_rule_test:
      - {eval_time: 9m, alertname: ForgejoOperatorDown, exp_alerts: []}
      - eval_time: 11m
        alertname: ForgejoOperatorDown
        exp_alerts:
          - exp_labels: {severity: critical, controller: forgejo}
            exp_annotations:
              summary: The Forgejo operator is not running or not scraped
              runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoOperatorDown.md

  - name: reconcile errors and a work queue backlog, also of the runner controller
    interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_total{controller="forgejo", result="success"}'
        values: '0+10x40'
      - series: 'controller_runtime_reconcile_errors_total{controller="forgejorunner"}'
        values: '0+1x40'
      - series: 'workqueue_depth{name="forgejorunner"}'
        values: '25x40'
      # Other controllers of the same manager are not the operator's business.
      - series: 'workqueue_depth{name="something-else"}'
        values: '100x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: ForgejoOperatorReconcileErrors, exp_alerts: []}
      - eval_time: 30m
        alertname: ForgejoOperatorReconcileErrors
        exp_alerts:
          - exp_labels: {severity: warning, controller: forgejorunner}
            exp_annotations:
              summary: The Forgejo operator keeps failing to reconcile forgejorunner
              runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoOperatorReconcileErrors.md
      - {eval_time: 14m, alertname: ForgejoOperatorWorkQueueBacklog, exp_alerts: []}
      - eval_time: 16m
        alertname: ForgejoOperatorWorkQueueBacklog
        exp_alerts:
          - exp_labels: {severity: warning, name: forgejorunner}
            exp_annotations:
              summary: The Forgejo operator work queue forgejorunner is backing up
              runbook_url: https://github.com/lictl/forgejo-operator/blob/main/docs/runbooks/ForgejoOperatorWorkQueueBacklog.md
