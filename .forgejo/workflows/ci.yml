# Manual diagnostics on Forgejo Actions. Source pushes and pull requests run CI on GitHub.
# The rules job requires a Docker-enabled runner; it does not publish packages.
name: ci

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Unit tests and envtest suite
        run: make test
      - name: Generated files are committed
        run: |
          git status --short
          git diff --exit-code

  rules:
    runs-on: docker
    container:
      image: docker.io/library/docker:29.9.2-cli
    steps:
      # The Makefile runs its recipes with bash.
      - run: apk add --no-cache bash git go make nodejs
      - uses: actions/checkout@v4
      - name: Prometheus rule tests
        env:
          GOTOOLCHAIN: auto
        # promtool runs in a container of the runner's daemon, which sees this job's files only
        # through the job container's volumes, not at their path.
        run: >
          make test-rules
          PROMTOOL="docker run --rm --volumes-from $(hostname) -w $PWD/test/prometheus --entrypoint promtool prom/prometheus:v3.15.0"
