# The cluster-scoped part of manager-role, which a RoleBinding cannot grant: nodes (job
# placement next to node-local volumes, schedulable nodes and their memory for HA and
# vertical sizing), persistentvolumes (node affinity of bound volumes), storageclasses
# (allowVolumeExpansion) and the Pod Security label of a ForgejoRunner's namespace.
# Read-only. internal/forgejo/rbac_test.go keeps it equal to those rules of
# config/rbac/role.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/managed-by: kustomize
  name: forgejo-operator-cluster-reader
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - nodes
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/managed-by: kustomize
  name: forgejo-operator-cluster-reader-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forgejo-operator-cluster-reader
subjects:
- kind: ServiceAccount
  name: forgejo-operator-controller-manager
  namespace: forgejo-operator-system
