# permissions to do leader election.
# controller-runtime keeps the leader lock in a Lease (get, create, update; it never lists,
# watches, patches or deletes it) and records the leader's events in the operator's own
# namespace through the core/v1 event API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/managed-by: kustomize
  name: leader-election-role
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
