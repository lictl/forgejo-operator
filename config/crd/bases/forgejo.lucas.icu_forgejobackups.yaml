---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: forgejobackups.forgejo.lucas.icu
spec:
  group: forgejo.lucas.icu
  names:
    categories:
    - forgejo-all
    kind: ForgejoBackup
    listKind: ForgejoBackupList
    plural: forgejobackups
    shortNames:
    - fjb
    singular: forgejobackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forgejoRef.name
      name: Forgejo
      type: string
    - jsonPath: .spec.reason
      name: Reason
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.remote.phase
      name: Remote
      type: string
    - jsonPath: .status.completionTime
      name: Completed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ForgejoBackup is a point-in-time backup of a Forgejo instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ForgejoBackup
            properties:
              forgejoRef:
                description: forgejoRef is the instance to back up.
                properties:
                  name:
                    description: name of the Forgejo.
                    maxLength: 56
                    minLength: 1
                    pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              includeData:
                description: |-
                  includeData archives the data volume (repositories, LFS, attachments). Defaults to
                  the instance's spec.backup.includeData (true).
                type: boolean
              reason:
                default: Manual
                description: 'reason is informational and drives retention: only Scheduled
                  backups are pruned.'
                enum:
                - Manual
                - Scheduled
                - PreUpgrade
                type: string
            required:
            - forgejoRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: status defines the observed state of ForgejoBackup
            properties:
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dataSizeBytes:
                format: int64
                type: integer
              databaseSizeBytes:
                format: int64
                type: integer
              forgejoImage:
                description: forgejoImage running when the backup was taken (restores
                  must use a compatible image).
                type: string
              includesData:
                type: boolean
              jobName:
                type: string
              message:
                type: string
              path:
                description: path of the backup directory inside the PVC.
                type: string
              phase:
                description: BackupPhase is the lifecycle of a backup.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              postgresImage:
                description: |-
                  postgresImage whose pg_dump wrote the database dump: the image of the instance's running
                  PostgreSQL. A restore into a server of an older major is refused.
                type: string
              pvcName:
                description: pvcName holding the backup files.
                type: string
              remote:
                description: remote reports the upload of the backup to spec.backup.remote
                  of its instance.
                properties:
                  completionTime:
                    format: date-time
                    type: string
                  files:
                    description: files uploaded, with the size and SHA-256 of their
                      contents before encryption.
                    items:
                      description: RemoteBackupFile is one file of a remote backup.
                      properties:
                        name:
                          description: name of the file before encryption (the object's
                            name ends in ".bin").
                          type: string
                        sha256:
                          description: sha256 of the contents before encryption, in
                            hex.
                          type: string
                        sizeBytes:
                          description: sizeBytes of the contents before encryption.
                          format: int64
                          type: integer
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  jobName:
                    type: string
                  keyFingerprint:
                    description: keyFingerprint identifies the key the backup was
                      encrypted with.
                    type: string
                  keySecret:
                    description: keySecret held the encryption key.
                    properties:
                      key:
                        default: key
                        description: key in the Secret.
                        maxLength: 253
                        pattern: ^[-._a-zA-Z0-9]*$
                        type: string
                      name:
                        description: name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  location:
                    description: 'location of the backup: s3://<bucket>/<prefix>/<path>/.'
                    type: string
                  message:
                    type: string
                  path:
                    description: |-
                      path of the backup below the prefix ("<namespace>/<name>/<backup>-<uid>", where <uid> is
                      the first 8 characters of the ForgejoBackup's UID, so that every ForgejoBackup has a
                      directory of its own): what a ForgejoRestore (spec.remote.path) or a new Forgejo
                      (spec.restoreFrom.remote.path) restores it by.
                    type: string
                  phase:
                    description: RemoteBackupPhase is the lifecycle of the upload
                      of a backup.
                    enum:
                    - Pending
                    - Uploading
                    - Uploaded
                    - Failed
                    type: string
                  s3:
                    description: |-
                      s3 is the bucket the upload Job writes to, recorded when it starts: what the operator
                      checks (and cleans up) after an upload that did not succeed, whatever spec.backup.remote
                      says by then.
                    properties:
                      bucket:
                        description: bucket is the bucket name.
                        maxLength: 63
                        minLength: 3
                        pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                        type: string
                      credentialsSecret:
                        description: |-
                          credentialsSecret holds the access key. Forgejo gets it through environment variables
                          that reference the Secret, never in app.ini; changing the Secret restarts the pods.
                        properties:
                          accessKeyIDKey:
                            default: AWS_ACCESS_KEY_ID
                            description: accessKeyIDKey is the key holding the access
                              key ID.
                            maxLength: 253
                            pattern: ^[-._a-zA-Z0-9]*$
                            type: string
                          name:
                            description: name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                          secretAccessKeyKey:
                            default: AWS_SECRET_ACCESS_KEY
                            description: secretAccessKeyKey is the key holding the
                              secret access key.
                            maxLength: 253
                            pattern: ^[-._a-zA-Z0-9]*$
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: |-
                          endpoint is the URL of the S3 API, scheme://host[:port] without a path, e.g.
                          https://s3.eu-central-1.amazonaws.com or http://garage.s3-lab.svc.cluster.local:3900.
                          A short host name is resolved from the instance's namespace. https uses TLS.
                        maxLength: 512
                        minLength: 1
                        pattern: ^https?://(\[[0-9A-Fa-f:.]+\]|[A-Za-z0-9]([-A-Za-z0-9.]*[A-Za-z0-9])?)(:[0-9]{1,5})?/?$
                        type: string
                      pathStyle:
                        description: |-
                          pathStyle addresses the bucket in the path (https://host/bucket/key) when true, and as
                          a host name (https://bucket.host/key, virtual-hosted style) when false. Unset uses
                          virtual-hosted style for Amazon S3, Google Cloud Storage and Alibaba Cloud OSS endpoints
                          and path style for every other endpoint.
                        type: boolean
                      prefix:
                        description: |-
                          prefix is prepended to every object key, e.g. "forgejo-a" to share a bucket between
                          instances. Each subsystem uses its own prefix below it ("forgejo-a/lfs/...").
                        maxLength: 256
                        pattern: ^[A-Za-z0-9_-][A-Za-z0-9_.-]*(/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*/?$
                        type: string
                      region:
                        default: us-east-1
                        description: |-
                          region of the bucket, which requests are signed for. It must match the server's
                          region (e.g. "garage" for Garage's default configuration).
                        maxLength: 64
                        pattern: ^[A-Za-z0-9_-]*$
                        type: string
                      tls:
                        description: |-
                          tls configures how the server's certificate is verified (https endpoints only). By
                          default it must be signed by a CA of the image's system trust store.
                        properties:
                          caSecret:
                            description: |-
                              caSecret names a Secret key holding the PEM certificate(s) of the CA that signed the
                              server's certificate, e.g. the "ca.crt" of a cert-manager certificate. They are trusted
                              in addition to the system trust store.
                            properties:
                              key:
                                default: ca.crt
                                description: key in the Secret.
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]*$
                                type: string
                              name:
                                description: name of the Secret.
                                maxLength: 253
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          insecureSkipVerify:
                            description: insecureSkipVerify accepts any certificate.
                              For tests only.
                            type: boolean
                        type: object
                        x-kubernetes-validations:
                        - message: caSecret and insecureSkipVerify are mutually exclusive
                          rule: '!(has(self.insecureSkipVerify) && self.insecureSkipVerify
                            && has(self.caSecret))'
                    required:
                    - bucket
                    - credentialsSecret
                    - endpoint
                    type: object
                    x-kubernetes-validations:
                    - message: tls requires an https:// endpoint
                      rule: '!has(self.tls) || self.endpoint.startsWith(''https://'')'
                  startTime:
                    format: date-time
                    type: string
                  verified:
                    description: |-
                      verified is true when every file was read back from the bucket, decrypted, and its
                      SHA-256 matched.
                    type: boolean
                type: object
              startTime:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
