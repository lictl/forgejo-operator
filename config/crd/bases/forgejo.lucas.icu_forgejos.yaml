                      from it. A restore that pauses the upgrade moves it to the end of that pause.
                    format: date-time
                    type: string
                  startTime:
                    format: date-time
                    type: string
                  toImage:
                    type: string
                type: object
              url:
                description: url is the external ROOT_URL.
                type: string
              version:
                description: version reported by the running Forgejo (/api/v1/version).
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must start with a lowercase letter and contain only
            lowercase letters, digits and ''-'' (no ''.''): it names the instance''s
            Services, which must be DNS-1035 labels'
          rule: self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
        - message: 'metadata.name must be at most 56 characters: Service "<name>-valkey"
            must fit in 63'
          rule: size(self.metadata.name) <= 56
        - message: 'with database.type CNPG, metadata.name must be at most 47 characters:
            CloudNativePG limits the name of Cluster "<name>-db" to 50'
          rule: '!has(self.spec.database.type) || self.spec.database.type != ''CNPG''
            || size(self.metadata.name) <= 47'
        - message: 'metadata.name must not end in ''-valkey'': PodDisruptionBudget
            "<name>" would have the name of the Valkey PodDisruptionBudget of another
            instance with highAvailability'
          rule: '!self.metadata.name.endsWith(''-valkey'')'
        - message: 'with highAvailability.enabled, metadata.name must be at most 45
            characters: the pods of StatefulSet "<name>-valkey" carry the label controller-revision-hash=<name>-valkey-<hash>,
            which must fit in 63'
          rule: '!has(self.spec.highAvailability) || !has(self.spec.highAvailability.enabled)
            || !self.spec.highAvailability.enabled || size(self.metadata.name) <=
            45'
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
