---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: forgejos.forgejo.lucas.icu
spec:
  group: forgejo.lucas.icu
  names:
    categories:
    - forgejo-all
    kind: Forgejo
    listKind: ForgejoList
    plural: forgejos
    shortNames:
    - fj
    singular: forgejo
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.readyReplicas
      name: Replicas
      type: integer
    - jsonPath: .status.conditions[?(@.type=="VersionSupported")].reason
      name: Support
      priority: 1
      type: string
    - jsonPath: .status.database.majorVersion
      name: Postgres
      priority: 1
      type: integer
    - jsonPath: .status.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Forgejo is a managed Forgejo software forge instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Forgejo
            properties:
              admin:
                default: {}
                description: admin configures the bootstrap administrator account.
                properties:
                  email:
                    default: forgejo_admin@forgejo.local
                    maxLength: 254
                    pattern: ^[^@\s]+@[^@\s]+$
                    type: string
                  existingSecret:
                    description: |-
                      existingSecret holds the admin password under passwordKey. When empty the operator
                      generates "<name>-admin" with keys "username" and "password".
                    type: string
                  passwordKey:
                    default: password
                    type: string
                  username:
                    default: forgejo_admin
                    description: |-
                      username of the administrator: letters, digits, "-", "_" and ".", starting and ending
                      with a letter or digit, without two of "-", "_" and "." in a row, and none of the names
                      Forgejo reserves (e.g. "admin").
                    maxLength: 40
                    minLength: 1
                    pattern: ^[A-Za-z0-9]([A-Za-z0-9_.-]*[A-Za-z0-9])?$
                    type: string
                    x-kubernetes-validations:
                    - message: must not contain two of '-', '_' and '.' in a row (Forgejo
                        user names)
                      rule: '!self.matches(''[-_.]{2}'')'
                    - message: is a name Forgejo reserves; the administrator could
                        not be created
                      rule: '!(self.lowerAscii() in [''admin'', ''api'', ''assets'',
                        ''attachments'', ''avatar'', ''avatars'', ''captcha'', ''commits'',
                        ''debug'', ''error'', ''explore'', ''ghost'', ''issues'',
                        ''login'', ''metrics'', ''milestones'', ''new'', ''notifications'',
                        ''org'', ''pulls'', ''raw'', ''repo'', ''repo-avatars'', ''search'',
                        ''user'', ''v2''])'
                type: object
              autoPilot:
                default: {}
                description: autoPilot configures self-healing, auto-tuning and storage
                  auto-expansion.
                properties:
                  autoTuning:
                    default: {}
                    description: AutoTuningSpec configures automatic Forgejo tuning
                      from the pod's resources.
                    properties:
                      enabled:
                        description: |-
                          enabled derives GOMEMLIMIT, DB connection pool sizes and queue workers from resources.
                          Values in spec.config always win. Defaults to true.
                        type: boolean
                    type: object
                  selfHealing:
                    default: {}
                    description: SelfHealingSpec configures abnormality detection
                      and remediation.
                    properties:
                      configRollback:
                        description: |-
                          configRollback reverts to the last known good app.ini when a configuration change makes
                          Forgejo crash-loop. Defaults to true.
                        type: boolean
                      enabled:
                        description: enabled defaults to true.
                        type: boolean
                      failureThreshold:
                        default: 5
                        description: failureThreshold consecutive failed health checks
                          before remediation.
                        format: int32
                        minimum: 1
                        type: integer
                      healthCheckInterval:
                        default: 30s
                        description: healthCheckInterval between /api/healthz probes
                          performed by the operator.
                        maxLength: 32
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|μs|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: must be a positive Go duration such as 30s, 5m
                            or 1h
                          rule: duration(self) > duration('0s')
                    type: object
                  storageAutoExpand:
                    default: {}
                    description: StorageAutoExpandSpec grows PVCs before they fill
                      up.
                    properties:
                      enabled:
                        description: enabled defaults to true. Requires a StorageClass
                          with allowVolumeExpansion.
                        type: boolean
                      incrementPercent:
                        default: 50
                        description: incrementPercent of current size added on each
                          expansion.
                        format: int32
                        minimum: 10
                        type: integer
                      maxSize:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 200Gi
                        description: maxSize caps automatic growth.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      thresholdPercent:
                        default: 80
                        description: thresholdPercent of used capacity that triggers
                          an expansion.
                        format: int32
                        maximum: 99
                        minimum: 50
                        type: integer
                    type: object
                type: object
              autoscaling:
                default: {}
                description: autoscaling configures horizontal (HPA) and vertical
                  (operator-driven) scaling.
                properties:
                  horizontal:
                    description: HorizontalAutoscalingSpec creates a HorizontalPodAutoscaler.
                      Requires highAvailability.enabled.
                    properties:
                      enabled:
                        type: boolean
                      maxReplicas:
                        default: 5
                        format: int32
                        minimum: 1
                        type: integer
                      minReplicas:
                        default: 2
                        format: int32
                        minimum: 1
                        type: integer
                      targetCPUUtilizationPercentage:
                        default: 75
                        format: int32
                        minimum: 1
                        type: integer
                      targetMemoryUtilizationPercentage:
                        description: targetMemoryUtilizationPercentage adds a memory
                          metric to the HPA.
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - fieldPath: .minReplicas
                      message: minReplicas must not be greater than maxReplicas
                      reason: FieldValueInvalid
                      rule: '!has(self.minReplicas) || !has(self.maxReplicas) || self.minReplicas
                        <= self.maxReplicas'
                  vertical:
                    description: |-
                      VerticalAutoscalingSpec lets the operator right-size the Forgejo container from observed
                      usage (metrics.k8s.io) and OOM kills.
                    properties:
                      enabled:
                        type: boolean
                      maxAllowed:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: maxAllowed resources the operator will not exceed.
                        type: object
                      minAllowed:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: minAllowed resources the operator will not go
                          below.
                        type: object
                      targetUtilizationPercentage:
                        default: 70
                        description: targetUtilizationPercentage of requests the operator
                          aims for.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                    type: object
                type: object
              backup:
                default: {}
                description: backup configures scheduled backups (PostgreSQL dump
                  + data archive).
                properties:
                  enabled:
                    description: enabled turns on scheduled backups.
                    type: boolean
                  includeData:
                    description: includeData adds the data volume (repositories, LFS,
                      attachments) to backups. Defaults to true.
                    type: boolean
                  remote:
                    description: |-
                      remote uploads every backup (scheduled, manual and pre-upgrade), encrypted, to an
                      S3-compatible bucket outside the cluster, after it was written to the backup PVC. Remote
                      copies of scheduled backups follow retention; the others are never deleted by the
                      operator. See docs/backup-restore.md, "Remote backups".
                    properties:
                      encryption:
                        default: {}
                        description: encryption configures the key every remote backup
                          is encrypted with.
                        properties:
                          keySecret:
                            description: |-
                              keySecret names the Secret key that holds the encryption key: at least 16 characters,
                              without leading or trailing white space. Without it, the operator generates a random key
                              once into Secret "<name>-backup-key" (key "key"), which it never changes and never
                              deletes; BackupHealthy is False (BackupKeyNotExported) until that Secret is annotated
                              forgejo.lucas.icu/backup-key-exported=true. Keep a copy of the key outside the
                              cluster: backups cannot be restored without it.
                            properties:
                              key:
                                default: key
                                description: key in the Secret.
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]*$
                                type: string
                              name:
                                description: name of the Secret.
                                maxLength: 253
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                      image:
                        description: |-
                          image is the rclone image of the Jobs that upload and download remote backups. Defaults to
                          docker.io/rclone/rclone:1.75.2.
                        maxLength: 512
                        type: string
                      s3:
                        description: |-
                          s3 is the bucket. Backups go to "<prefix>/<namespace>/<name>/<backup>/". Use another
                          bucket, or another prefix, than spec.objectStorage, and a key that may write, read, list
                          and delete objects there.
                        properties:
                          bucket:
                            description: bucket is the bucket name.
                            maxLength: 63
                            minLength: 3
                            pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                            type: string
                          credentialsSecret:
                            description: |-
                              credentialsSecret holds the access key. Forgejo gets it through environment variables
                              that reference the Secret, never in app.ini; changing the Secret restarts the pods.
                            properties:
                              accessKeyIDKey:
                                default: AWS_ACCESS_KEY_ID
                                description: accessKeyIDKey is the key holding the
                                  access key ID.
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]*$
                                type: string
                              name:
                                description: name of the Secret.
                                maxLength: 253
                                minLength: 1
                                type: string
                              secretAccessKeyKey:
                                default: AWS_SECRET_ACCESS_KEY
                                description: secretAccessKeyKey is the key holding
                                  the secret access key.
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]*$
                                type: string
                            required:
                            - name
                            type: object
                          endpoint:
                            description: |-
                              endpoint is the URL of the S3 API, scheme://host[:port] without a path, e.g.
                              https://s3.eu-central-1.amazonaws.com or http://garage.s3-lab.svc.cluster.local:3900.
                              A short host name is resolved from the instance's namespace. https uses TLS.
                            maxLength: 512
                            minLength: 1
                            pattern: ^https?://(\[[0-9A-Fa-f:.]+\]|[A-Za-z0-9]([-A-Za-z0-9.]*[A-Za-z0-9])?)(:[0-9]{1,5})?/?$
                            type: string
                          pathStyle:
                            description: |-
                              pathStyle addresses the bucket in the path (https://host/bucket/key) when true, and as
                              a host name (https://bucket.host/key, virtual-hosted style) when false. Unset uses
                              virtual-hosted style for Amazon S3, Google Cloud Storage and Alibaba Cloud OSS endpoints
                              and path style for every other endpoint.
                            type: boolean
                          prefix:
                            description: |-
                              prefix is prepended to every object key, e.g. "forgejo-a" to share a bucket between
                              instances. Each subsystem uses its own prefix below it ("forgejo-a/lfs/...").
                            maxLength: 256
                            pattern: ^[A-Za-z0-9_-][A-Za-z0-9_.-]*(/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*/?$
                            type: string
                          region:
                            default: us-east-1
                            description: |-
                              region of the bucket, which requests are signed for. It must match the server's
                              region (e.g. "garage" for Garage's default configuration).
                            maxLength: 64
                            pattern: ^[A-Za-z0-9_-]*$
                            type: string
                          tls:
                            description: |-
                              tls configures how the server's certificate is verified (https endpoints only). By
                              default it must be signed by a CA of the image's system trust store.
                            properties:
                              caSecret:
                                description: |-
                                  caSecret names a Secret key holding the PEM certificate(s) of the CA that signed the
                                  server's certificate, e.g. the "ca.crt" of a cert-manager certificate. They are trusted
                                  in addition to the system trust store.
                                properties:
                                  key:
                                    default: ca.crt
                                    description: key in the Secret.
                                    maxLength: 253
                                    pattern: ^[-._a-zA-Z0-9]*$
                                    type: string
                                  name:
                                    description: name of the Secret.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                required:
                                - name
                                type: object
                              insecureSkipVerify:
                                description: insecureSkipVerify accepts any certificate.
                                  For tests only.
                                type: boolean
                            type: object
                            x-kubernetes-validations:
                            - message: caSecret and insecureSkipVerify are mutually
                                exclusive
                              rule: '!(has(self.insecureSkipVerify) && self.insecureSkipVerify
                                && has(self.caSecret))'
                        required:
                        - bucket
                        - credentialsSecret
                        - endpoint
                        type: object
                        x-kubernetes-validations:
                        - message: tls requires an https:// endpoint
                          rule: '!has(self.tls) || self.endpoint.startsWith(''https://'')'
                    required:
                    - s3
                    type: object
                  retention:
                    default: 7
                    description: retention is the number of successful scheduled backups
                      to keep.
                    format: int32
                    minimum: 1
                    type: integer
                  schedule:
                    default: 0 3 * * *
                    description: |-
                      schedule in cron format: five fields (minute hour day-of-month month day-of-week), or
                      a descriptor such as @daily or "@every 6h", optionally preceded by "CRON_TZ=<zone> ".
                      The API server checks the form; the operator reports a value it cannot parse as
                      BackupHealthy=False/InvalidSchedule.
                    maxLength: 128
                    type: string
                    x-kubernetes-validations:
                    - message: must be a cron expression with five fields (minute
                        hour day-of-month month day-of-week), or @yearly, @monthly,
                        @weekly, @daily, @hourly or @every <duration>, optionally
                        preceded by CRON_TZ=<zone>
                      rule: self.matches('^((CRON_TZ|TZ)=[^[:space:]]+ +)?(@(yearly|annually|monthly|weekly|daily|midnight|hourly)|@every
                        ([0-9]+([.][0-9]+)?(ns|us|µs|μs|ms|s|m|h))+|[^@[:space:]][^[:space:]]*([[:space:]]+[^[:space:]]+){4})$')
                  storage:
                    default: {}
                    description: |-
                      storage configures the backup PVC ("<name>-backups"), used by every backup kind
                      (scheduled, manual, pre-upgrade).
                    properties:
                      existingClaim:
                        description: existingClaim writes backups to a pre-provisioned
                          PVC.
                        type: string
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 20Gi
                        description: |-
                          size of the backup volume. The operator only grows the claim (when its StorageClass
                          allows expansion): a lower size is ignored. The operator does not resize an
                          existingClaim.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        type: string
                    type: object
                type: object
              config:
                additionalProperties:
                  additionalProperties:
                    type: string
                  type: object
                description: |-
                  config holds raw app.ini overrides as section -> key -> value. Use the section name
                  "DEFAULT" for root-level keys (e.g. APP_NAME). Operator-managed keys (database, secrets,
                  paths) win over overrides only where noted in the documentation.
                type: object
              configFrom:
                description: configFrom injects app.ini values read from Secrets (mailer
                  passwords, OAuth secrets, ...).
                items:
                  description: ConfigValueFromSecret sets one app.ini key from a Secret.
                  properties:
                    key:
                      minLength: 1
                      type: string
                    secretKeyRef:
                      description: SecretKeySelector selects a key of a Secret.
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    section:
                      minLength: 1
                      type: string
                  required:
                  - key
                  - secretKeyRef
                  - section
                  type: object
                type: array
              database:
                default: {}
                description: database selects the PostgreSQL backend. Defaults to
                  an operator-managed CloudNativePG cluster.
                properties:
                  cnpg:
                    default: {}
                    description: cnpg configures the operator-managed CloudNativePG
                      cluster.
                    properties:
                      enablePodMonitor:
                        description: enablePodMonitor asks CNPG to create a PodMonitor
                          for PostgreSQL metrics.
                        type: boolean
                      imageName:
                        default: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
                        description: |-
                          imageName is the PostgreSQL operand image, with a tag that starts with its major version
                          (CloudNativePG images: MM-TYPE-OS, MM.mm-TYPE-OS, MM.mm-TS-TYPE-OS). A change within the
                          major is rolled out by CloudNativePG. A newer major is an orchestrated upgrade: cold
                          database backup, CloudNativePG's in-place pg_upgrade, verification, rollback on failure
                          (docs/upgrades.md, "PostgreSQL major upgrades"); it must keep the image's Debian release
                          (trixie, bookworm, ...). Older majors are refused. Backup and restore Jobs run pg_dump and
                          pg_restore from the image of the running cluster (status.database.image), and with type
                          External from this one.
                        maxLength: 512
                        minLength: 1
                        type: string
                      instances:
                        default: 1
                        description: instances is the number of PostgreSQL instances
                          (1 primary + N-1 replicas).
                        format: int32
                        minimum: 1
                        type: integer
                      parameters:
                        additionalProperties:
                          type: string
                        description: parameters are extra postgresql.conf parameters.
                        type: object
                      resources:
                        description: ResourceRequirements describes the compute resource
                          requirements.
                        properties:
                          claims:
                            description: |-
                              Claims lists the names of resources, defined in spec.resourceClaims,
                              that are used by this container.

                              This field depends on the
                              DynamicResourceAllocation feature gate.

                              This field is immutable. It can only be set for containers.
                            items:
                              description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                              properties:
                                name:
                                  description: |-
                                    Name must match the name of one entry in pod.spec.resourceClaims of
                                    the Pod where this field is used. It makes that resource available
                                    inside a container.
                                  type: string
                                request:
                                  description: |-
                                    Request is the name chosen for a request in the referenced claim.
                                    If empty, everything from the claim is made available, otherwise
                                    only the result of this request.
                                  type: string
                              required:
                              - name
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Limits describes the maximum amount of compute resources allowed.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Requests describes the minimum amount of compute resources required.
                              If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                              otherwise to an implementation-defined value. Requests cannot exceed Limits.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                        type: object
                      storage:
                        default: {}
                        description: |-
                          storage of each PostgreSQL instance. The operator only grows its size: a lower size is
                          ignored.
                        properties:
                          size:
                            anyOf:
                            - type: integer
                            - type: string
                            default: 5Gi
                            description: 'size of the volume. The operator only grows
                              the volume: a lower size is ignored.'
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          storageClassName:
                            type: string
                        type: object
                    type: object
                  external:
                    description: external points at an existing PostgreSQL server.
                    properties:
                      credentialsSecret:
                        description: credentialsSecret holds the username and password.
                        properties:
                          name:
                            minLength: 1
                            type: string
                          passwordKey:
                            default: password
                            type: string
                          usernameKey:
                            default: username
                            type: string
                        required:
                        - name
                        type: object
                      database:
                        default: forgejo
                        type: string
                      host:
                        description: |-
                          host of the PostgreSQL server. Short names are resolved from the instance's namespace,
                          like they are inside its pods.
                        minLength: 1
                        type: string
                      port:
                        default: 5432
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      sslMode:
                        default: disable
                        enum:
                        - disable
                        - require
                        - verify-ca
                        - verify-full
                        type: string
                    required:
                    - credentialsSecret
                    - host
                    type: object
                  type:
                    default: CNPG
                    description: DatabaseType selects the PostgreSQL provider.
                    enum:
                    - CNPG
                    - External
                    type: string
                type: object
                x-kubernetes-validations:
                - fieldPath: .external
                  message: type External requires external (host and credentialsSecret)
                  reason: FieldValueRequired
                  rule: '!has(self.type) || self.type != ''External'' || has(self.external)'
                - fieldPath: .type
                  message: external requires type External
                  reason: FieldValueInvalid
                  rule: '!has(self.external) || (has(self.type) && self.type == ''External'')'
                - fieldPath: .cnpg
                  message: cnpg settings apply to type CNPG only; with type External
                    only cnpg.imageName (the image of backup and restore Jobs) is
                    used
                  reason: FieldValueForbidden
                  rule: '!has(self.type) || self.type != ''External'' || !has(self.cnpg)
