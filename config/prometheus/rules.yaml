# Alerts about the operator itself. Per-instance alerts (ForgejoDown, ForgejoNotReady, ...)
# are generated by the operator as one PrometheusRule per Forgejo object.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-rules
  namespace: system
spec:
  groups:
    - name: forgejo-operator
      rules:
        - alert: ForgejoOperatorDown
          # controller-runtime exports reconcile_total for every controller as soon as it starts.
          expr: absent(controller_runtime_reconcile_total{controller="forgejo"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: The Forgejo operator is not running or not scraped
            description: >-
              No metrics from the forgejo controller for 10 minutes. Forgejo instances keep
              serving, but upgrades, backups, health checks and self-healing are stopped.
              Check the controller-manager Deployment in the operator namespace and its logs.
        - alert: ForgejoOperatorReconcileErrors
          expr: sum by (controller) (increase(controller_runtime_reconcile_errors_total{controller=~"forgejo|forgejobackup|forgejorestore"}[15m])) > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The Forgejo operator keeps failing to reconcile {{ $labels.controller }}
            description: >-
              {{ $value | printf "%.0f" }} reconcile errors in 15 minutes. The Degraded condition and
              ReconcileError events of the affected objects name the failing step; the operator
              logs have the details.
        - alert: ForgejoOperatorWorkQueueBacklog
          expr: max by (name) (workqueue_depth{name=~"forgejo|forgejobackup|forgejorestore"}) > 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The Forgejo operator work queue {{ $labels.name }} is backing up
            description: >-
              {{ $value }} items have been waiting for 15 minutes; the operator is slow or stuck
              (API server throttling, slow Forgejo/HTTP probes). Check the operator logs and
              controller_runtime_reconcile_time_seconds.
