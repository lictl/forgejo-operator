# Prometheus Monitor Service (Metrics)
# Scrapes the operator's own /metrics endpoint: controller-runtime metrics plus the
# forgejo_operator_* metrics (see docs/observability.md).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https # Ensure this is the name of the port that exposes HTTPS metrics
      scheme: https
      interval: 30s
      # forgejo_operator_* series identify a Forgejo instance by their own "namespace" and
      # "name" labels. honorLabels keeps them (instead of renaming the instance namespace to
      # exported_namespace), which the per-instance PrometheusRules generated by the operator
      # and the Grafana dashboard rely on.
      honorLabels: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # The default metrics server generates a self-signed certificate. For verified TLS,
        # mount your own certificate in the manager and configure its CA here; see docs/observability.md.
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: forgejo-operator
