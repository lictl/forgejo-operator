apiVersion: forgejo.lucas.icu/v1alpha1
kind: Forgejo
metadata:
  labels:
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/managed-by: kustomize
  name: forgejo-sample
  # The pod runs as uid 1000 only and passes the "restricted" Pod Security Standard. On a
  # volume that ignores fsGroup (NFS, hostPath) and is not writable by uid 1000, this adds a
  # root init container that chowns the top-level data directories (needs "baseline").
  # annotations:
  #   forgejo.lucas.icu/fix-permissions: "true"
spec:
  # The current Forgejo LTS release (the default); docs/versions.md lists the supported ones.
  image: codeberg.org/forgejo/forgejo:15
  # More than one replica requires highAvailability.enabled (Valkey for cache, sessions and
  # queues); the API server refuses replicas > 1 without it.
  replicas: 1
  server:
    appName: Forgejo
    # domain: git.example.com      # public host name (DOMAIN, SSH_DOMAIN, ROOT_URL)
  # ingress:
  #   enabled: true
  #   host: git.example.com
  #   # Unset: the cluster's default IngressClass, applied when the Ingress is created, is kept.
  #   className: nginx
  #   tlsSecretName: git-example-com-tls
  database:
    # An operator-managed CloudNativePG cluster "<name>-db" of one instance, for a quick start
    # or a small installation; for a replicated database use type: External.
    cnpg:
      # The default. A newer major here is an orchestrated upgrade: cold database backup,
      # CloudNativePG's pg_upgrade, verification (docs/upgrades.md).
      imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
      storage:
        size: 5Gi
  storage:
    size: 10Gi
    # Keep the data PVC, CNPG cluster and generated secrets when this resource is deleted.
    retainPolicy: Retain
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Raw app.ini overrides (section -> key -> value). Use "DEFAULT" for root-level keys.
  config:
    service:
      DEFAULT_KEEP_EMAIL_PRIVATE: "true"
