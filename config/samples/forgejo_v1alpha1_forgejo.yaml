apiVersion: forgejo.lucas.icu/v1alpha1
kind: Forgejo
metadata:
  labels:
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/managed-by: kustomize
  name: forgejo-sample
spec:
  image: codeberg.org/forgejo/forgejo:16
  server:
    appName: Forgejo
    # domain: git.example.com      # public host name (DOMAIN, SSH_DOMAIN, ROOT_URL)
  # ingress:
  #   enabled: true
  #   host: git.example.com
  #   # Unset: the cluster's default IngressClass, applied when the Ingress is created, is kept.
  #   className: nginx
  #   tlsSecretName: git-example-com-tls
  database:
    # An operator-managed CloudNativePG cluster "<name>-db".
    cnpg:
      instances: 1
      storage:
        size: 5Gi
  storage:
    size: 10Gi
    # Keep the data PVC, CNPG cluster and generated secrets when this resource is deleted.
    retainPolicy: Retain
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Raw app.ini overrides (section -> key -> value). Use "DEFAULT" for root-level keys.
  config:
    service:
      DEFAULT_KEEP_EMAIL_PRIVATE: "true"
