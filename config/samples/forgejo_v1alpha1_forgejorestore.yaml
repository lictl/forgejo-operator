# Restores forgejobackup-sample into forgejo-sample. Forgejo is scaled to zero while the
# database and the data volume are replaced, then scaled back up.
apiVersion: forgejo.lucas.icu/v1alpha1
kind: ForgejoRestore
metadata:
  labels:
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/managed-by: kustomize
  name: forgejorestore-sample
spec:
  forgejoRef:
    name: forgejo-sample
  backupName: forgejobackup-sample
  restoreDatabase: true
  restoreData: true
