name: Chart
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Check Helm and generated CRDs
        run: |
          helm version --short
          cmp LICENSE charts/forgejo-operator/LICENSE
          diff -r config/crd/bases charts/forgejo-operator/crds
          helm lint --strict charts/forgejo-operator
          helm template forgejo-operator charts/forgejo-operator --include-crds > /tmp/forgejo-operator-render.yaml
          helm package charts/forgejo-operator -d /tmp
          helm show readme /tmp/forgejo-operator-*.tgz | grep -q 'Helm chart'
          ! helm lint --strict charts/forgejo-operator --set rbac.namespaced=true
      - name: Scan full Git history for new secrets
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git . --log-opts=--all --redact --no-banner --baseline-path .gitleaks-baseline.json
      - name: Check Chart archive reproducibility
        run: |
          test_dir="$(mktemp -d)"
          mkdir -p "$test_dir/a" "$test_dir/b" "$test_dir/out-a" "$test_dir/out-b"
          cp -R charts/forgejo-operator "$test_dir/a/"
          cp -R charts/forgejo-operator "$test_dir/b/"
          find "$test_dir/a" -type f -exec touch -t 202001010101 {} +
          find "$test_dir/b" -type f -exec touch -t 202510101010 {} +
          helm package "$test_dir/a/forgejo-operator" -d "$test_dir/out-a"
          helm package "$test_dir/b/forgejo-operator" -d "$test_dir/out-b"
          chart_version="$(helm show chart charts/forgejo-operator | sed -n 's/^version: //p')"
          go run -mod=readonly hack/normalize-chart.go "$test_dir/out-a/forgejo-operator-$chart_version.tgz" "$test_dir/a.tgz" 1700000000
          go run -mod=readonly hack/normalize-chart.go "$test_dir/out-b/forgejo-operator-$chart_version.tgz" "$test_dir/b.tgz" 1700000000
          cmp "$test_dir/a.tgz" "$test_dir/b.tgz"
      - name: Check source mode and time normalization
        run: python3 hack/test-normalize-source-times.py
      - name: Check two Linux architectures compile
        run: |
          go version
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -o /tmp/manager-amd64 ./cmd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -o /tmp/manager-arm64 ./cmd
