name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed vX.Y.Z tag
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'lictl/forgejo-operator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Pin Buildx to the Forgejo job version
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-amd64 -o "$HOME/.docker/cli-plugins/docker-buildx"
          echo "e25d5cd675092bb5d1d03632fdc46cdf3fede7b514dc5f023a105e00d3ce5ad4  $HOME/.docker/cli-plugins/docker-buildx" | sha256sum -c -
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
          docker buildx version
      - name: Build and publish GHCR artifacts
        env:
          REGISTRY_HOST: ghcr.io
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          bash hack/release.sh
