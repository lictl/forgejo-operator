name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Kubernetes ${{ matrix.kubernetes }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.30"
            node-image: kindest/node:v1.30.10@sha256:4de75d0e82481ea846c0ed1de86328d821c1e6a6a91ac37bf804e5313670e507
          - kubernetes: "1.37"
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The checksums are those published as kind-linux-<arch>.sha256sum next to each binary of
      # the release. Update the version and both checksums together.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256_AMD64: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          KIND_SHA256_ARM64: 20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2
        run: |
          arch="$(go env GOARCH)"
          case "$arch" in
            amd64) sha256="$KIND_SHA256_AMD64" ;;
            arm64) sha256="$KIND_SHA256_ARM64" ;;
            *) echo "No kind checksum for $arch" >&2; exit 1 ;;
          esac
          curl -fsSLo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-${arch}"
          echo "${sha256}  kind" | sha256sum --check --strict -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Run manager and data lifecycle E2E
        env:
          KIND_NODE_IMAGE: ${{ matrix.node-image }}
        run: make test-e2e
