name: Vulnerability check

on:
  push:
  pull_request:
  schedule:
    # New advisories appear without any change to this repository.
    - cron: '23 5 * * 1'

permissions: {}

jobs:
  govulncheck:
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # go.mod pins the toolchain, so the standard library is checked at that release too.
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Exits non-zero when the code calls a vulnerable symbol.
      - name: Scan for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
